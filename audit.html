<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Amaliia AI — Profile Audit</title>
<style>
  :root {
    --bg:#0b0c10;--panel:rgba(255,255,255,.06);--panel2:rgba(255,255,255,.12);
    --text:#e9eef3;--muted:#a8b3bd;--accent:#c1ff72;--accent2:#7df9ff;
    --radius:16px;--shadow:0 10px 30px rgba(0,0,0,.35)
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:24px}
  h1{margin:0 0 12px;font-size:clamp(24px,4vw,36px)}
  p.muted{color:var(--muted);margin:.25rem 0 1rem}
  .card{background:var(--panel);border:1px solid var(--panel2);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}
  label{display:grid;gap:6px;font-size:.95rem}
  input,select,button{
    padding:10px;border-radius:10px;border:1px solid var(--panel2);
    background:#111318;color:var(--text);outline:none
  }
  button.primary{background:linear-gradient(120deg,var(--accent),var(--accent2));
    color:#0b0c10;border:none;font-weight:800;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--panel2);cursor:pointer}
  details{margin-top:10px} summary{cursor:pointer}
  .report{margin-top:14px}
  .score-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
  .chip{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:12px;padding:12px}
  .panel h3{margin:0 0 6px}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  code{display:inline-block;padding:6px 8px;border-radius:8px;background:#0e1016;
    border:1px solid rgba(255,255,255,.08);margin:4px 6px 0 0}
  .export-row{display:flex;justify-content:flex-end;margin-top:12px}
  @media(max-width:800px){.row{grid-template-columns:1fr} .grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Profile Audit</h1>
  <p class="muted">Enter a handle and goal. Optionally tweak advanced signals.</p>

  <div class="card">
    <div class="row">
      <label>Platform<select id="platform"><option>Instagram</option><option>TikTok</option><option>YouTube</option></select></label>
      <label>@handle<input id="handle" placeholder="@yourname" /></label>
      <label>Goal<select id="goal"><option>Growth</option><option>Leads</option><option>UGC</option><option>Iconic style</option></select></label>
   <label>
  Topic/Niche
  <input id="topic" type="text" placeholder="fitness, calisthenics, women’s sport, rehab" />
</label>
    </div>

    <details>
      <summary><strong>Advanced signals</strong></summary>
      <div class="row">
        <label>Posts last 30d<input id="s_posts" type="number" value="30"></label>
        <label>Posting days last 30d<input id="s_days" type="number" value="28"></label>
        <label>Niche hashtag ratio<input id="s_niche" type="number" step="0.05" value="0.75"></label>
      </div>
      <div class="row">
        <label>Avg hashtags/post<input id="s_avg_tags" type="number" value="12"></label>
        <label>Cover text ratio<input id="s_cover" type="number" step="0.05" value="0.6"></label>
        <label>Format mix<input id="s_mix" type="text" value='{"reels":0.7,"photos":0.2,"carousels":0.1}'></label>
      </div>
      <div class="row">
        <label><input id="s_bio_offer" type="checkbox" checked> Bio has offer</label>
        <label><input id="s_bio_hook" type="checkbox" checked> First line hook</label>
        <label><input id="s_link" type="checkbox" checked> Link visible</label>
      </div>
      <div class="row">
        <label>Hook rate<input id="s_hook" type="number" step="0.05" value="0.55"></label>
        <label>CTA rate<input id="s_cta" type="number" step="0.05" value="0.35"></label>
      </div>
    </details>

    <div style="margin-top:12px;display:flex;gap:10px;">
      <button class="primary" id="go">Generate</button>
      <button class="ghost" id="demo">@oh_naastya demo</button>
    </div>
  </div>

  <div class="card report"><pre id="out">Ready to generate…</pre></div>
</div>

<script>
const out = document.getElementById('out');
document.getElementById('demo').onclick = () => {
  document.getElementById('handle').value='@oh_naastya';
  document.getElementById('platform').value='Instagram';
  document.getElementById('goal').value='Growth';
};

document.getElementById('go').onclick = async () => {
  out.textContent = 'Calculating…';
  const mix = safeJson(document.getElementById('s_mix').value,{reels:0.7,photos:0.2,carousels:0.1});
  const body = {
    handle: document.getElementById('handle').value || '@yourname',
    platform: document.getElementById('platform').value,
    goal: document.getElementById('goal').value,
    signals: buildSignals(mix)
  };
  console.log('BODY TO API:', body);

  try{
    const r=await fetch('/api/audit2',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const t=await r.text();if(!r.ok)return out.textContent=`Error ${r.status}:\n${t}`;
    const d=JSON.parse(t);
    out.parentElement.innerHTML=renderReport(d);
    attachPrint();
  }catch(e){out.textContent='Network error: '+e;}
};

function buildSignals(mix){
  const def={posts_last_30d:26,posting_days_last_30d:22,niche_hashtag_ratio:0.65,avg_hashtags_per_post:11,
    format_mix:{reels:0.6,photos:0.3,carousels:0.1},cover_text_ratio:0.5,bio_has_offer:true,
    bio_first_line_hook:true,link_visible:true,hook_rate:0.5,cta_rate:0.3};
  const val=id=>Number(document.getElementById(id)?.value||def[id.replace('s_','')]||0);
  return {
    posts_last_30d: val('s_posts'), posting_days_last_30d: val('s_days'),
    niche_hashtag_ratio: val('s_niche'), avg_hashtags_per_post: val('s_avg_tags'),
    format_mix: mix || def.format_mix, cover_text_ratio: val('s_cover'),
    bio_has_offer: document.getElementById('s_bio_offer')?.checked ?? true,
    bio_first_line_hook: document.getElementById('s_bio_hook')?.checked ?? true,
    link_visible: document.getElementById('s_link')?.checked ?? true,
    hook_rate: val('s_hook'), cta_rate: val('s_cta')
  };
}

function safeJson(s,f){try{return JSON.parse(s);}catch{return f;}}
function renderReport(d){
  const scoreRow = d.scores?Object.entries(d.scores).map(([k,v])=>`<div class="chip"><strong>${k}</strong>&nbsp;${v}%</div>`).join(''):'';
  const findings=d.findings?Object.entries(d.findings).map(([k,a])=>`<h4>${k}</h4><ul>${(a||[]).map(i=>`<li>${i}</li>`).join('')}</ul>`).join(''):'';
  const actions=(d.actions_next7days||[]).map(a=>`<li>${a}</li>`).join('');
  const hooks=(d.ready_to_copy?.hooks||[]).map(h=>`<code>${h}</code>`).join('');
  const tags=(d.ready_to_copy?.hashtags||[]).map(t=>`<span class="chip">${t}</span>`).join('');
  return `
    <h3>Report for ${d.profile?.handle||''} · ${d.profile?.platform||''}</h3>
    <p class="muted">Goal: ${d.profile?.goal||''}</p>
    <div class="score-row">${scoreRow}</div>
    <div class="grid-2">
      <section class="panel"><h3>Findings</h3>${findings}</section>
      <section class="panel"><h3>Next 7 Days</h3><ul>${actions}</ul>${hooks}${tags}</section>
    </div>
    <div class="export-row"><button class="ghost" id="exportPdf">Export PDF</button></div>
  `;
}
function attachPrint(){document.getElementById('exportPdf').onclick=()=>window.print();}
</script>
</body>
</html>
