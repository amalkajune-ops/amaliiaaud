<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amaliia Audit - Demo</title>
<style>
body{background:#0b0c10;color:#e9eef3;font-family:Inter,Arial,sans-serif;margin:0;padding:24px}
input,select,button{padding:10px;border-radius:10px;border:1px solid #333;background:#111318;color:#e9eef3}
button{background:linear-gradient(120deg,#c1ff72,#7df9ff);color:#0b0c10;border:none;font-weight:700}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;margin-top:14px}
pre{white-space:pre-wrap;word-break:break-word}
</style></head><body>
<h1>AI Profile Audit — demo</h1>
<div>
  <select id="platform"><option>Instagram</option><option>TikTok</option><option>YouTube</option></select>
  <input id="handle" placeholder="@yourname">
  <select id="goal"><option>Growth</option><option>Leads</option><option>UGC</option><option>Iconic style</option></select>
  <button id="go">Generate</button>
</div>
<div class="card"><pre id="out">Ready to generate…</pre></div>
<script>
const out = document.getElementById('out');
const btn = document.getElementById('go');

btn.onclick = async () => {
  const body = {
    handle: document.getElementById('handle').value || '@yourname',
    platform: document.getElementById('platform').value,
    goal: document.getElementById('goal').value
  };

  out.textContent = 'Calculating…';

  try {
    const r = await fetch('/api/audit2', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
      cache:'no-store'
    });

    const text = await r.text();
    if (!r.ok) {
      out.textContent = `Error ${r.status}:\n${text}`;
      return;
    }

    let data;
    try { data = JSON.parse(text); }
    catch { out.textContent = 'Response is not JSON:\n' + text; return; }

    // Render pretty report
    out.parentElement.innerHTML = renderReport(data);
    attachPrint();
  } catch (e) {
    out.textContent = 'Network error: ' + String(e);
  }
};

function renderReport(d){
  const scoreRow = Object.entries(d.scores || {}).map(([k,v]) =>
    `<div class="chip"><strong>${k}</strong>&nbsp;${v}%</div>`
  ).join('');

  const findings = d.findings ? Object.entries(d.findings).map(([k,arr])=>{
    const items = (arr||[]).map(i=>`<li>${i}</li>`).join('');
    return `<div class="block"><h4>${cap(k)}</h4><ul>${items}</ul></div>`;
  }).join('') : '';

  const actions = (d.actions_next7days||[]).map(a=>`<li>${a}</li>`).join('');
  const hooks = (d.ready_to_copy?.hooks||[]).map(h=>`<code>${h}</code>`).join('');
  const tags  = (d.ready_to_copy?.hashtags||[]).map(t=>`<span class="pill">${t}</span>`).join('');

  return `
    <div class="report-head">
      <h3>Report for <span class="accent">${escapeHtml(d.profile?.handle || '@yourname')}</span> · ${escapeHtml(d.profile?.platform || '')}</h3>
      <p class="muted">Goal: ${escapeHtml(d.profile?.goal || '')}</p>
    </div>
    <div class="score-row">${scoreRow}</div>
    <div class="grid-2">
      <section class="panel"><h3>Findings</h3>${findings || '<p class="muted">No findings</p>'}</section>
      <section class="panel">
        <h3>Next 7 Days</h3>
        ${actions ? `<ul class="actions">${actions}</ul>` : '<p class="muted">No actions</p>'}
        ${hooks ? '<h4>Ready-to-copy Hooks</h4>'+hooks : ''}
        ${tags  ? '<div class="tags">'+tags+'</div>' : ''}
      </section>
    </div>
    <div class="export-row"><button class="btn ghost" id="exportPdf">Export PDF</button></div>
  `;
}

function attachPrint(){
  const btn = document.getElementById('exportPdf');
  if (btn) btn.onclick = () => window.print();
}

function cap(s){ return (s||'').slice(0,1).toUpperCase()+ (s||'').slice(1); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) }
</script>
