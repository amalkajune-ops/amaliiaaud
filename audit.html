<script>
document.getElementById('go').onclick = async () => {
  const body = {
    handle: document.getElementById('handle').value || '@yourname',
    platform: document.getElementById('platform').value,
    goal: document.getElementById('goal').value
  };
  const out = document.getElementById('out');
  out.textContent = 'Считаю…';
  try {
    const r = await fetch('/api/audit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const text = await r.text();         // читаем как текст, чтобы видеть ошибки
    if (!r.ok) {                         // если 4xx/5xx — покажем статус и тело
      out.textContent = `Ошибка ${r.status}: ${text}`;
      return;
    }
    out.textContent = JSON.stringify(JSON.parse(text), null, 2);
  } catch (err) {
    out.textContent = 'Сетевая ошибка: ' + String(err);
  }
};
</script>
