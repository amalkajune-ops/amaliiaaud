<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Profile Audit — demo</title>
<style>
  :root{--bg:#0b0c10;--panel:rgba(255,255,255,.06);--panel2:rgba(255,255,255,.12);--text:#e9eef3;--muted:#a8b3bd;--accent:#c1ff72;--accent2:#7df9ff;--radius:16px}
  *{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
  .container{max-width:980px;margin:0 auto;padding:24px}
  h1{margin:0 0 16px} h2{margin:0 0 10px}
  .card{background:var(--panel);border:1px solid var(--panel2);border-radius:var(--radius);padding:16px;margin:14px 0}
  label{display:grid;gap:6px;font-size:.95rem}
  input,select,textarea,button{padding:10px;border-radius:10px;border:1px solid #333;background:#111318;color:var(--text)}
  textarea{min-height:62px; resize:vertical}
  button.primary{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#0b0c10;border:none;font-weight:700;cursor:pointer}
  .grid{display:grid;gap:12px;grid-template-columns:1fr 1fr 1fr}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--panel2);font-size:.9rem;color:var(--muted);margin:2px}
  .score-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .chip{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}
  code{display:block;padding:8px 10px;border-radius:8px;background:#0e1016;border:1px solid rgba(255,255,255,.08);margin:6px 0 0;white-space:normal}
  .right{display:flex;justify-content:flex-end}
  details{margin-top:8px}
  table th, table td{padding:8px 10px;vertical-align:top}
  thead th{position:sticky; top:0; background:#0e1016}
  @media (max-width:860px){ .grid{grid-template-columns:1fr 1fr}; .grid2{grid-template-columns:1fr} }
  @media (max-width:580px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
  <div class="container">
    <h1>AI Profile Audit</h1>
    <p class="muted">Enter handle & goal. Use the quick checkboxes — the model will not guess.</p>

    <!-- FORM -->
    <div class="card">
      <div class="grid">
        <label>
          Platform
          <select id="platform">
            <option>Instagram</option><option>TikTok</option><option>YouTube</option>
          </select>
        </label>

        <label>
          @handle
          <input id="handle" placeholder="@yourname" />
        </label>

        <label>
          Goal
          <select id="goal">
            <option>Growth</option><option>Leads</option><option>UGC</option><option>Iconic style</option>
          </select>
        </label>
      </div>

      <div class="grid" style="margin-top:10px">
        <label>
          Topic/Niche
          <input id="topic" placeholder="e.g., fitness, women’s sport, calisthenics" />
        </label>
        <label>
          Geo (optional)
          <input id="geo" placeholder="e.g., Miami" />
        </label>
        <label>
          Audience (optional)
          <input id="audience" placeholder="e.g., women 18–30" />
        </label>
      </div>

      <!-- Lazy inputs -->
      <div class="grid" style="margin-top:10px">
        <label>
          Posting frequency (last 30d)
          <select id="cadenceSelect">
            <option value="">Select…</option>
            <option value="daily">Daily (25–30 posts / 20–30 days)</option>
            <option value="often">3–5×/week (12–20 posts)</option>
            <option value="rare">1–2×/week (4–8 posts)</option>
            <option value="none">Almost none (0–3 posts)</option>
          </select>
        </label>

        <label>
          Hashtags: niche or broad?
          <select id="tagStyle">
            <option value="">Select…</option>
            <option value="niche">Mostly niche (10–50k)</option>
            <option value="mixed">Mixed</option>
            <option value="broad">Mostly broad (500k+)</option>
          </select>
        </label>

        <label>
          Avg hashtags per post
          <input id="avgTags" type="number" min="0" placeholder="e.g., 10–15" />
        </label>
      </div>

      <div class="grid" style="margin-top:10px">
        <label>
          Sample hashtags (comma-separated)
          <textarea id="hashtagsInput" placeholder="#miamiluxury, #calisthenicsgirls, #miamisports"></textarea>
        </label>
        <label>
          Bio (paste your current bio)
          <textarea id="bioText" placeholder="1st line hook + offer + link"></textarea>
        </label>
        <label>
          Posts usually have CTA?
          <select id="ctaFreq">
            <option value="">Select…</option>
            <option value="always">In every post</option>
            <option value="often">Often (≈50%)</option>
            <option value="rare">Rarely (&lt;20%)</option>
            <option value="never">No CTA</option>
          </select>
        </label>
      </div>

      <details>
        <summary>Advanced (optional)</summary>
        <div class="grid" style="margin-top:10px">
          <label>Cover text ratio (0..1) <input id="coverRatio" type="number" step="0.01" min="0" max="1" placeholder="0.6" /></label>
          <label>Hook rate (0..1) <input id="hookRate" type="number" step="0.01" min="0" max="1" placeholder="0.55" /></label>
          <label>Format mix (reels/photos/carousels)
            <div class="row">
              <input id="mixReels" type="number" step="0.01" min="0" max="1" placeholder="0.7" style="width:33%">
              <input id="mixPhotos" type="number" step="0.01" min="0" max="1" placeholder="0.2" style="width:33%">
              <input id="mixCar" type="number" step="0.01" min="0" max="1" placeholder="0.1" style="width:33%">
            </div>
          </label>
        </div>
        <div class="grid" style="margin-top:10px">
          <label>Bio has offer <select id="bioOffer"><option value="">—</option><option value="true">true</option><option value="false">false</option></select></label>
          <label>First-line hook <select id="bioHook"><option value="">—</option><option value="true">true</option><option value="false">false</option></select></label>
          <label>Link visible <select id="linkVisible"><option value="">—</option><option value="true">true</option><option value="false">false</option></select></label>
        </div>
      </details>

      <div class="row" style="margin-top:12px">
        <button class="primary" id="go">Generate</button>
        <button id="demo" type="button">@ampirdol demo</button>
        <!-- Правильное место для кнопки оплаты -->
        <button id="subscribeBtn" type="button" class="primary">Subscribe $9.99/mo</button>
      </div>
    </div>

    <!-- OUTPUT -->
    <div class="card" id="reportBox">
      <pre id="out" class="muted">Ready…</pre>
    </div>
  </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const subBtn = document.getElementById('subscribeBtn');
  if (subBtn) {
    subBtn.addEventListener('click', async () => {
      try {
        const r = await fetch('/api/checkout', { method: 'POST' });
        const raw = await r.text(); // читаем как текст
        let data;
        try { data = JSON.parse(raw); }
        catch { alert('Payment error (non-JSON): ' + raw); return; }

        if (!r.ok) {
          alert('Payment error: ' + (data?.error || r.status));
          return;
        }
        if (data?.url) {
          window.location.href = data.url;
        } else {
          alert('Payment error: no URL in response');
        }
      } catch (err) {
        alert('Server error: ' + err.message);
      }
    });
  }
});
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = (id)=>document.getElementById(id);
  const out = $('out');

  // Кнопка Stripe Checkout
  const subBtn = $('subscribeBtn');
  if (subBtn) {
    subBtn.addEventListener('click', async () => {
      try {
        const r = await fetch('/api/checkout', { method: 'POST' });
        const data = await r.json();
        if (data.url) window.location.href = data.url;
        else alert('Payment error: ' + (data.error || 'unknown'));
      } catch (err) {
        alert('Server error: ' + err.message);
      }
    });
  }

  /* DEMO PREFILL */
  $('demo').onclick = () => {
    $('platform').value = 'Instagram';
    $('handle').value = '@ampirdol';
    $('goal').value = 'Growth';
    $('topic').value = "luxury lifestyle, miami vibe";
    $('geo').value = "Miami";
    $('audience').value = "women 18–35";
    $('cadenceSelect').value = 'daily';
    $('tagStyle').value = 'mixed';
    $('avgTags').value = 12;
    $('hashtagsInput').value = "#miamiluxury, #miamivibe, #luxurywomen, #miamifashion";
    $('bioText').value = "Luxury life in Miami. Reviews, tips, and real talk.\n👇 Start here";
    $('ctaFreq').value = 'often';
    $('coverRatio').value = 0.6;
    $('hookRate').value = 0.55;
    $('mixReels').value = 0.7; $('mixPhotos').value = 0.2; $('mixCar').value = 0.1;
    $('bioOffer').value = 'true'; $('bioHook').value = 'true'; $('linkVisible').value = 'true';
  };

  $('go').onclick = async () => {
    const cadenceMap = {
      daily: { posts_last_30d: 28, posting_days_last_30d: 25 },
      often: { posts_last_30d: 16, posting_days_last_30d: 12 },
      rare:  { posts_last_30d: 6,  posting_days_last_30d: 6  },
      none:  { posts_last_30d: 1,  posting_days_last_30d: 1  },
    };
    const cadenceSel = $('cadenceSelect').value;
    const cadence = cadenceMap[cadenceSel] || {};

    const ctaMap = { always: 0.9, often: 0.5, rare: 0.2, never: 0.0 };
    const tagRatioMap = { niche: 0.75, mixed: 0.5, broad: 0.2 };

    const body = {
      handle: $('handle').value.trim() || '@yourname',
      platform: $('platform').value,
      goal: $('goal').value,
      signals: {
        topic: ($('topic').value || '').trim(),
        geo: ($('geo').value || '').trim(),
        audience: ($('audience').value || '').trim(),

        ...cadence,
        niche_hashtag_ratio: numOr(tagRatioMap[$('tagStyle').value]),
        avg_hashtags_per_post: num($('avgTags').value),

        hashtags_entered: parseTags($('hashtagsInput').value),

        bio_text: ($('bioText').value || '').trim(),
        cta_rate: numOr(ctaMap[$('ctaFreq').value]),

        cover_text_ratio: num($('coverRatio').value),
        hook_rate: num($('hookRate').value),

        format_mix: {
          reels: num($('mixReels').value),
          photos: num($('mixPhotos').value),
          carousels: num($('mixCar').value)
        },

        bio_has_offer: boolOrNull($('bioOffer').value),
        bio_first_line_hook: boolOrNull($('bioHook').value),
        link_visible: boolOrNull($('linkVisible').value),
      }
    };

    out.textContent = 'Calculating…';
    try{
      const r = await fetch('/api/audit2', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body),
        cache:'no-store'
      });
      const text = await r.text();
      if(!r.ok){ out.textContent = `Error ${r.status}:\n${text}`; return; }
      let data; try{ data = JSON.parse(text) }catch{ out.textContent = text; return; }
      $('reportBox').innerHTML = renderReport(data);
      attachPrint();
    }catch(e){ out.textContent = 'Network error: '+ String(e); }
  };

  // helpers
  function parseTags(s){
    return (s||'')
      .split(/[,\s]+/)
      .map(t=>t.trim())
      .filter(Boolean)
      .map(t=>t.startsWith('#')?t.slice(1):t.toLowerCase());
  }
  function num(v){ const x = Number(v); return Number.isFinite(x) ? x : undefined }
  function numOr(v){ const x = Number(v); return Number.isFinite(x) ? x : undefined }
  function boolOrNull(v){ if(!v) return undefined; return String(v).toLowerCase()==='true' }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]))}

  // UI render
  function renderReport(d){
    const scoreRow = Object.entries(d.scores||{}).map(([k,v])=>`<span class="chip"><strong>${k}</strong> ${v}%</span>`).join('');
    const findings = d.findings ? Object.entries(d.findings).map(([k,arr])=>{
      const items = (arr||[]).map(i=>`<li>${escapeHtml(i)}</li>`).join('');
      return `<div class="panel"><h3 style="margin:0 0 6px">${escapeHtml(k)}</h3>${items?`<ul>${items}</ul>`:'<p class="muted">—</p>'}</div>`;
    }).join('') : '';

    const sig = d.profile?.signals || {};
    const actionsList = (Array.isArray(d.actions_next7days) && d.actions_next7days.length)
      ? d.actions_next7days
      : [
          `Post 5× this week in ${sig.topic || 'your niche'} (Reels 3, Photos 1, Carousel 1).`,
          `Write 9 hook variants and A/B test 3 per post (first 12 words).`,
          `Add explicit CTA in every post (comment a/b, save checklist, DM keyword).`,
          `Refresh covers: readable text on ${(sig.cover_text_ratio!=null?Math.round(sig.cover_text_ratio*100):'60')}%+ posts.`,
          `Build 2 hashtag clusters (niche + geo ${sig.geo ? '('+sig.geo+')' : ''}) and rotate per post.`
        ];

    const actions = actionsList.map(a=>`<li>${escapeHtml(a)}</li>`).join('');
    const hooks = (d.ready_to_copy?.hooks||[]).map(h=>`<code>${escapeHtml(h)}</code>`).join('');
    const tags  = (d.ready_to_copy?.hashtags||[]).map(t=>`<span class="pill">#${escapeHtml(t.replace(/^#/,''))}</span>`).join('');

    return `
      <h2>Report for <span class="pill">${escapeHtml(d.profile?.handle||'@yourname')}</span> · ${escapeHtml(d.profile?.platform||'')}</h2>
      <p class="muted">Goal: ${escapeHtml(d.profile?.goal||'')}</p>
      <div class="score-row">${scoreRow}</div>

      <div class="grid2">
        <section class="panel"><h3>Findings</h3>${findings || '<p class="muted">—</p>'}</section>
        <section class="panel">
          <h3>Next 7 Days</h3>
          ${actions ? `<ul>${actions}</ul>`:'<p class="muted">No actions</p>'}
          ${hooks ? '<h3 style="margin:10px 0 6px">Ready-to-copy Hooks</h3>'+hooks:''}
          ${tags  ? '<div style="margin-top:8px">'+tags+'</div>':''}
          <div class="right" style="margin-top:10px"><button id="exportPdf">Export PDF</button></div>
        </section>
      </div>

      ${renderPlan(d.plan_7d || [])}
    `;
  }

  function renderPlan(plan){
    if (!Array.isArray(plan) || !plan.length) return '';
    const rows = plan.map(p => `
      <tr>
        <td>${p.day ?? ''}</td>
        <td>${escapeHtml(p.post_type||'')}</td>
        <td>${escapeHtml(p.angle||'')}</td>
        <td><code>${escapeHtml(p.hook||'')}</code></td>
        <td>${(p.storyboard||[]).map(s=>`• ${escapeHtml(s)}`).join('<br>')}</td>
        <td>${(p.caption_outline||[]).map(s=>`• ${escapeHtml(s)}`).join('<br>')}</td>
        <td><strong>${escapeHtml(p.cta||'')}</strong></td>
        <td>${(p.hashtag_cluster||[]).map(t=>`#${escapeHtml(t)}`).join(' ')}</td>
        <td>${escapeHtml(p.time_window||'')}</td>
        <td>${escapeHtml(p.kpi||'')}</td>
      </tr>
    `).join('');

    return `
      <section class="panel" style="margin-top:12px">
        <h3 style="margin:0 0 6px">7-day plan</h3>
        <div style="overflow:auto">
          <table style="width:100%;border-collapse:separate;border-spacing:0 6px;font-size:.95rem">
            <thead style="color:#a8b3bd;text-align:left">
              <tr>
                <th>Day</th><th>Type</th><th>Angle</th><th>Hook</th>
                <th>Storyboard</th><th>Caption</th><th>CTA</th>
                <th>Hashtags</th><th>Time</th><th>KPI</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>
    `;
  }

  function attachPrint(){
    const b=document.getElementById('exportPdf');
    if(b) b.onclick=()=>window.print();
  }
});
</script>
</body>
</html>
